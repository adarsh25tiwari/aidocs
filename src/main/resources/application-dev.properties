#database congigurations

spring.datasource.url =jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:aidocs}
spring.datasource.username = ${DB_USER:postgres}
spring.datasource.password = ${DB_PASSWORD:postgres}

# 2. Hibernate Schema & SQL Logging
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# OpenAI Configurations
spring.ai.openai.api-key=${OPENAI_API_KEY:demo-key}
spring.ai.openai.chat.model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
spring.ai.openai.chat.temperature=0.2
spring.ai.openai.embedding.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

# PGVector Store Configurations
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.schema-name=public
spring.ai.vectorstore.pgvector.initialize-schema=true

# Multipart File Upload Configurations
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB

# App Configurations
app.rag.chunk-size=700
# app.rag.chunk-overlap=100
app.rag.top-k=5
app.rag.similarity-threshold=0.0

app.cors.allowed-origins=*
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
