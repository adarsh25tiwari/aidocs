services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aidocs-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: aidocs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - docpgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  ollama:
    image: ollama/ollama:latest
    container_name: aidocs-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama

volumes:
  docpgdata:
  ollamadata: